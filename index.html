<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Front Sportsbook</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c1210;
        --ink: #f4f7f5;
        --muted: #9aa89f;
        --line: #24302b;
        --accent: #d6ff4a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(900px 420px at 50% -10%, rgba(214, 255, 74, 0.12), transparent 60%),
          var(--bg);
        color: var(--ink);
        font-family: "Segoe UI", sans-serif;
      }

      main {
        width: min(640px, calc(100% - 48px));
        padding: 40px 0 56px;
      }

      p {
        margin: 0;
      }

      .eyebrow {
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 12px 0 0;
        font-size: clamp(40px, 7vw, 64px);
        line-height: 0.95;
        letter-spacing: -0.04em;
      }

      .lead {
        margin-top: 20px;
        max-width: 42ch;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Projeto no ar</p>
      <h1>Front Sportsbook</h1>
      <p class="lead">A publicação na Vercel está ativa. O front-end do sportsbook entra nesta página.</p>
    </main>
  </body>
</html>
